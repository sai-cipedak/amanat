<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer · SAI Cipedak</title><link rel="stylesheet" href="volunteer.css"></head><body>
<header><div class="shell head"><div><small>SAI CIPEDAK · VOLUNTEER</small><h1>Volunteer Marketplace</h1></div><div class="head-actions"><a class="header-cta" href="opportunities.html?mode=kpi">Cari Opportunity</a><a href="index.html">Public Dashboard ↗</a></div></div></header>
<main class="shell">

<section class="card auth"><div><small>GOOGLE ACCOUNT</small><h2 id="auth-title">Belum login</h2><p id="auth-copy">Browse boleh tanpa login. Login diperlukan untuk profile dan Join.</p></div><div><button id="login">Continue with Google</button><button id="logout" class="secondary" hidden>Sign out</button></div></section>
<section id="profile" class="card" hidden><small>YOUR CAPACITY</small><h2>Volunteer Profile</h2><form id="profile-form"><div class="grid"><label>Display Name<input id="name" required></label><label>Email<input id="email" disabled></label><label class="wide">Professional Background<textarea id="background" rows="3" required></textarea></label><label>Organization<input id="org"></label><label>Available Time<select id="hours"><option value="1">&lt;2 jam/bulan</option><option value="3">2–4 jam/bulan</option><option value="6.5">5–8 jam/bulan</option><option value="12.5">9–16 jam/bulan</option><option value="20">&gt;16 jam/bulan</option></select></label><fieldset class="wide"><legend>Preferred Contribution</legend><label><input type="checkbox" id="advisor"> Advisor / SME</label><label><input type="checkbox" id="ops"> Operational / Execution</label><label><input type="checkbox" id="lead"> Project Lead</label></fieldset><label class="wide">Skills<div id="skills" class="skills"><span>Skill catalog belum di-seed.</span></div></label><label class="wide check"><input type="checkbox" id="contact" checked> Bersedia dihubungi terkait kesempatan kontribusi.</label></div><button type="submit">Save Profile</button><span id="msg"></span></form></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="volunteer.js"></script></body></html>
